<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zgadnij blachy!</title>
  <meta name="description" content="Gra quizowa: na podstawie tablicy rejestracyjnej zgadnij, do jakiego powiatu należy pojazd. 10 pytań, 4 odpowiedzi — ile punktów zdobędziesz?">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">

  <!-- Open Graph (Facebook, Messenger, LinkedIn) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Zgadnij blachy!">
  <meta property="og:description" content="Quiz o polskich tablicach rejestracyjnych: widzisz kod (np. DW), zgadujesz powiat. 10 pytań — zagraj i pobij swój rekord!">
  <meta property="og:locale" content="pl_PL">
  <meta property="og:site_name" content="Zgadnij blachy!">

  <!-- Twitter/X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Zgadnij blachy!">
  <meta name="twitter:description" content="Quiz o polskich tablicach rejestracyjnych: widzisz kod (np. DW), zgadujesz powiat. 10 pytań — zagraj i pobij swój rekord!">
</head>
<body x-data="quiz" @pointerdown="onPointerDown($event)">
  <main class="app">
    <h1 id="title" x-show="phase === 'quiz'" x-cloak>Zgadnij blachy!</h1>
    <div class="score-bar" id="score-bar" x-show="phase === 'quiz'" x-cloak>
      <span>Pytanie: <strong x-text="roundLabel">1/10</strong></span>
      <span>Punkty: <strong x-text="score">0</strong></span>
    </div>
    <p x-show="loading">Ładowanie danych…</p>
    <p x-show="error" x-text="error" class="status"></p>
    <div id="quiz" class="quiz" x-show="phase === 'quiz'" x-cloak>
      <div id="plate" class="plate" aria-label="Tablica rejestracyjna" :data-variant="variant">
        <div class="euroband">
          <span class="plate-stars" title="Iskro Bogów!">*</span><span class="plate-pl">|</span>
        </div>
        <div class="plate-chars">
          <span class="plate-prefix" x-text="prefix"></span>
          <div class="plate-sticker" title="Nalepka legalizacyjna"></div>
          <span class="plate-suffix" x-text="suffix"></span>
        </div>
      </div>
      <p class="wojewodztwo" :class="{ visible: showWojewodztwo }"
         x-text="wojewodztwo ? `Województwo: ${wojewodztwo}` : ' '" x-cloak></p>
      <div id="answers" class="answers">
        <template x-for="(opt, i) in options" :key="i">
          <button class="answer" :class="opt.state" :disabled="locked"
                  @click="onAnswer(i)" x-text="opt.text"></button>
        </template>
      </div>
      <div class="actions">
        <!-- KANONICZNY komentarz niezmiennika stałej szerokości przycisku: sizer
             niesie najdłuższą możliwą etykietę, a #next (.btn-next) rozciąga się
             do jego szerokości (grid-area 1/1, patrz .actions w style.css).
             TRZYMAĆ W SYNCHU z public/js/quiz.js — gdy zmienisz:
             · nextButtonLabel („Następna tablica” / „Pokaż wynik”) —
               zaktualizuj tekst sizer, jeśli nowa etykieta jest dłuższa;
             · AUTO_NEXT_MS (3000 → N sekund) — zaktualizuj licznik „(3)”
               (najdłuższa etykieta odliczania = „(N)”; ostatnie pytanie nie
               odlicza, więc „(N)” > „Pokaż wynik” dla N ≥ 2).
             Sizer musi być <button> (nie span) — identyczne metryki tekstu
             co do piksela; tabular-nums wyrównuje cyfry odliczania. -->
        <button type="button" class="btn-next btn-next-sizer" tabindex="-1" disabled
                aria-hidden="true">Następna tablica (3)</button>
        <button id="next" class="btn-next" x-ref="next"
                :class="{ 'btn-next-hidden': !showNext }" :disabled="!showNext"
                @click="onNext()"
                x-text="remaining === null ? nextButtonLabel : `${nextButtonLabel} (${remaining})`"
                x-cloak></button>
      </div>
      <p id="status" class="status" x-text="status"></p>
    </div>
    <div id="summary" class="summary" x-show="phase === 'summary'" x-cloak>
      <h2>Koniec gry!</h2>
      <div class="summary-score" role="status">
        <span class="summary-score-value" x-text="summaryScore"></span><span class="summary-score-outof">/10</span>
      </div>
      <p class="summary-verdict" :class="{ visible: showVerdict }"
         x-text="summaryVerdict" x-cloak></p>
      <div class="summary-row">
        <p class="summary-line">Czas: <strong x-text="summaryTime"></strong></p>
        <p class="summary-line">Tempo: <strong x-text="summaryRate"></strong></p>
      </div>
      <button id="restart" class="btn-next" x-ref="restart" @click="startGame()">Zagraj ponownie</button>
    </div>
  </main>
  <script type="module" src="js/quiz.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
