<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zgadnij blachy!</title>
  <meta name="description" content="Gra quizowa: na podstawie tablicy rejestracyjnej zgadnij, do jakiego powiatu należy pojazd. 10 pytań, 4 odpowiedzi — ile punktów zdobędziesz?">
  <link rel="stylesheet" href="style.css">

  <!-- Open Graph (Facebook, Messenger, LinkedIn) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Zgadnij blachy!">
  <meta property="og:description" content="Quiz o polskich tablicach rejestracyjnych: widzisz kod (np. DW), zgadujesz powiat. 10 pytań — zagraj i pobij swój rekord!">
  <meta property="og:locale" content="pl_PL">
  <meta property="og:site_name" content="Zgadnij blachy!">

  <!-- Twitter/X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Zgadnij blachy!">
  <meta name="twitter:description" content="Quiz o polskich tablicach rejestracyjnych: widzisz kod (np. DW), zgadujesz powiat. 10 pytań — zagraj i pobij swój rekord!">
</head>
<body>
  <main class="app">
    <h1 id="title">Zgadnij blachy!</h1>
    <div class="score-bar" id="score-bar">
      <span>Pytanie: <strong id="round">1/10</strong></span>
      <span>Punkty: <strong id="score">0</strong></span>
    </div>
    <div id="quiz" class="quiz">
    <div id="plate" class="plate" aria-label="Tablica rejestracyjna">
      <div class="euroband">
        <span class="plate-stars" title="Iskro Bogów!">*</span><span class="plate-pl">|</span></div>
      <div class="plate-chars">
        <span class="plate-prefix"></span>
        <div class="plate-sticker" title="Nalepka legalizacyjna"></div>
        <span class="plate-suffix"></span>
      </div>
    </div>
    <div id="answers" class="answers">
      <button class="answer" data-index="0"></button>
      <button class="answer" data-index="1"></button>
      <button class="answer" data-index="2"></button>
      <button class="answer" data-index="3"></button>
    </div>
    <div class="actions">
      <button id="next" class="btn-next" hidden>Następna tablica</button>
    </div>
    <p id="status" class="status" hidden></p>
    </div>
    <div id="summary" class="summary" hidden>
      <h2>Koniec gry!</h2>
      <div class="summary-row">
        <p class="summary-line">Wynik: <strong id="summary-score">0</strong>/10 pkt</p>
        <p class="summary-line">Czas: <strong id="summary-time">0</strong> s</p>
        <p class="summary-line">Tempo: <strong id="summary-rate">0</strong> pkt/s</p>
        <button id="restart" class="btn-next">Zagraj ponownie</button>
      </div>
    </div>
  </main>
  <script type="module" src="js/quiz.js"></script>
</body>
</html>
