name: Deploy do GitHub Pages

on:
  # Ręczne uruchomienie z zakładki Actions
  workflow_dispatch:
  # Automatycznie przy każdym pushu na main
  push:
    branches: [main]

# Uprawnienia wymagane do publikacji na Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Jedna instalacja Pages na raz
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Generowanie danych quizu
        run: npm run prepare-data

      - name: Pobieranie czcionki
        env:
          FONT_URL: ${{ secrets.FONT_URL }}
        run: npm run download:font

      # Publikujemy katalog public/ (z wygenerowanym dist/ w środku)
      - name: Upload artefaktu
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy do GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
